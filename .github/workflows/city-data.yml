name: Copy city data
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 "$(ls copy*city*data*.py | head -1)"
      - run: |
          git config user.name city-data-bot
          git config user.email city-data-bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "Update city data copy" && git push)
