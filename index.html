<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box Response">
<meta name="theme-color" content="#111317">
<title>Box Response Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<style>
  :root {
    --bg: #111317;
    --panel: rgba(22, 25, 31, 0.96);
    --panel-solid: #16191f;
    --line: #2a2f39;
    --text: #f2f4f7;
    --muted: #9aa3b2;
    --accent: #ef4444;      /* call / box lines */
    --mine: #f59e0b;        /* your first-due boxes */
    --hydrant: #facc15;
    --route: #38bdf8;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; }

  /* ---------- Top bar ---------- */
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: calc(env(safe-area-inset-top) + 10px) 10px 10px; pointer-events: none; }
  #topbar > * { pointer-events: auto; }
  .search { display: flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text);
    font-size: 17px; padding: 13px 14px; outline: none; }
  .search input::placeholder { color: var(--muted); }
  .search button { border: 0; background: transparent; color: var(--muted); font-size: 22px;
    width: 46px; cursor: pointer; }
  .search button.go { width: auto; padding: 0 16px; background: #ef4444; color: #fff; font-size: 15px; font-weight: 700; }
  #suggest { margin-top: 6px; background: var(--panel-solid); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  #suggest div { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #suggest div:last-child { border-bottom: 0; }
  #suggest div:active, #suggest div:hover { background: #222733; }
  #suggest small { color: var(--muted); display: block; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .row select, .row button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; font-size: 14px; }
  .row select { flex: 1; min-width: 0; }
  .row button { cursor: pointer; white-space: nowrap; }

  /* ---------- Banner ---------- */
  #banner { display: none; position: fixed; left: 10px; right: 10px; z-index: 20;
    top: calc(env(safe-area-inset-top) + 118px); background: #7f1d1d; border: 1px solid var(--accent);
    color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
  #banner a { color: #fecaca; }

  /* ---------- Bottom sheet ---------- */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel);
    border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; max-height: 50dvh;
    display: flex; flex-direction: column; box-shadow: 0 -6px 20px rgba(0,0,0,.45);
    padding-bottom: env(safe-area-inset-bottom); }
  #grab { padding: 8px 0 4px; cursor: pointer; flex: none; }
  #grab::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px;
    background: #4b5363; margin: 0 auto; }
  #sheetBody { overflow-y: auto; padding: 4px 14px 14px; }
  #sheet.collapsed #sheetBody { display: none; }
  @media (min-width: 820px) {
    #sheet { left: 10px; right: auto; width: 390px; bottom: 10px; border-radius: 14px;
      border: 1px solid var(--line); max-height: calc(100dvh - 150px); }
    #topbar { right: auto; width: 410px; }
    #banner { right: auto; width: 390px; }
  }
  .hint { color: var(--muted); padding: 6px 0 4px; }
  .addr { font-size: 18px; font-weight: 700; margin: 2px 0 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #1d212a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .stat b { font-size: 16px; }
  .stat.wide { grid-column: 1 / -1; }
  .stat.box b { font-size: 24px; color: var(--mine); }
  .stat .tag { width: fit-content; }
  .btns { display: flex; gap: 8px; margin: 10px 0 4px; }
  .btns a { flex: 1; text-align: center; text-decoration: none; color: var(--text); background: #1d212a;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  .hyd { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .hyd:last-child { border-bottom: 0; }
  .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--hydrant); color: #111;
    font-weight: 800; display: grid; place-items: center; font-size: 13px; }
  .hyd .main { font-weight: 600; }
  .hyd .sub { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #2a2f39; color: var(--muted); margin-left: 4px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .steps { padding-left: 20px; margin: 8px 0 0; font-size: 14px; }
  .steps li { margin-bottom: 6px; }
  .fine { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .loading { color: var(--muted); font-style: italic; }

  /* ---------- Map markers ---------- */
  .call-pin { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: var(--accent);
    transform: rotate(-45deg); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .hyd-pin { width: 24px; height: 24px; border-radius: 50%; background: var(--hydrant); color: #111;
    border: 2px solid #111; font: 800 12px/20px sans-serif; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .mapboxgl-popup-content { background: var(--panel-solid); color: var(--text); border-radius: 10px; font-size: 13px; }
  .mapboxgl-popup-tip { border-top-color: var(--panel-solid) !important; border-bottom-color: var(--panel-solid) !important; }
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div class="search">
    <input id="q" type="search" placeholder="Call address, e.g. 2900 W North Ave" autocomplete="off" enterkeyhint="search">
    <button id="clear" aria-label="Clear">&times;</button>
    <button id="go" class="go">Search</button>
  </div>
  <div id="suggest"></div>
  <div class="row">
    <select id="origin" aria-label="Responding from"></select>
    <button id="styleBtn">Satellite</button>
  </div>
</div>

<div id="banner"></div>

<!-- Shown only if the app's code never runs (e.g. a phone's file preview). The script removes it at startup. -->
<div id="nojs" style="position:fixed;inset:auto 12px 40% 12px;z-index:30;background:#7f1d1d;border:1px solid #ef4444;color:#fff;padding:14px;border-radius:12px;font-size:15px;line-height:1.45">
  <b>The app isn't running here.</b><br>
  You're seeing a preview that doesn't run apps. Open this file in Safari, Chrome, Edge or Firefox on a computer, or open it from a web link (like Netlify) on your phone.
</div>

<div id="sheet">
  <div id="grab" aria-label="Show or hide details"></div>
  <div id="sheetBody">
    <div class="hint">Search a call address, or tap anywhere on the map to drop a call pin.</div>
  </div>
</div>

<script>
(function () { var n = document.getElementById('nojs'); if (n) n.parentNode.removeChild(n); })();
// ============================================================
// SETTINGS
// ============================================================
const MAPBOX_TOKEN = 'pk.eyJ1Ijoiam9zZXBoaGVpbnplIiwiYSI6ImNtdjE1czBheDAyYWgyd3BzbjJrY3NpNmsifQ.gc6gMdQHobBCjJaFK2HTGw';

// Baltimore City's public 911-CAD map layers
const CITY = 'https://egisdata.baltimorecity.gov/egis/rest/services/911/BaltCity_911_RapidDeploy_layers/MapServer';
const LAYER = { stations: 0, hydrants: 3, boxes: 12 };
const AREA_FIELD = 'AddressDB.EGISDATA.Fire_RDs.Area';
const CITY_BBOX = [-76.72, 39.19, -76.52, 39.38];
const DEFAULT_HOUSE = { id: 'E-20', name: 'E-20 T-18 M-8', address: '3130 W. North Ave 21216',
                        lng: -76.670566868816607, lat: 39.309237721872378 };
const HYDRANT_FIELDS = 'HYDRANT_ID,CAD_ADDR,STREET_NUM,STREET_NAM,CROSS_STRE,CORNER_POS,LOCATION_D,LOCATION_1,SRC_MAIN_S,FEAT_STATU,CONDITION';
const STYLES = { dark: 'mapbox://styles/mapbox/dark-v11', sat: 'mapbox://styles/mapbox/satellite-streets-v12' };

// Any unexpected error shows on screen so it can be reported
window.addEventListener('error', e => { try { showBanner('<strong>Something went wrong:</strong> ' + esc(e.message || e)); } catch (x) {} });
window.addEventListener('unhandledrejection', e => { try { showBanner('<strong>Something went wrong:</strong> ' + esc((e.reason && e.reason.message) || e.reason)); } catch (x) {} });

// ============================================================
// SMALL HELPERS
// ============================================================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => (s == null ? '' : String(s)).trim();
function showBanner(html) { const b = $('banner'); b.innerHTML = html; b.style.display = 'block'; }
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } }

/*GEO-START*/
// Distance in feet between two [lng, lat] points
function feetBetween(a, b) {
  const R = 20902231; // earth radius in feet
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[1] - a[1]), dLng = toRad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function isClockwise(ring) {
  let s = 0;
  for (let i = 0; i < ring.length - 1; i++) s += (ring[i + 1][0] - ring[i][0]) * (ring[i + 1][1] + ring[i][1]);
  return s > 0;
}
function pointInRing(pt, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
// ArcGIS polygon rings -> GeoJSON Polygon / MultiPolygon (clockwise = outer, counter-clockwise = hole)
function esriToGeo(rings) {
  const polys = [], holes = [];
  rings.forEach(r => (isClockwise(r) ? polys.push([r]) : holes.push(r)));
  if (!polys.length) return { type: 'Polygon', coordinates: rings };
  holes.forEach(h => { (polys.find(p => pointInRing(h[0], p[0])) || polys[0]).push(h); });
  return polys.length === 1 ? { type: 'Polygon', coordinates: polys[0] } : { type: 'MultiPolygon', coordinates: polys };
}
function pointInGeo(pt, geom) {
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  return polys.some(p => pointInRing(pt, p[0]) && !p.slice(1).some(h => pointInRing(pt, h)));
}
// A label point for a polygon: area-weighted centroid of its biggest outer ring
function labelPoint(geom) {
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  let best = null, bestA = -1;
  polys.forEach(p => {
    const r = p[0]; let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < r.length - 1; i++) {
      const f = r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
      a += f; cx += (r[i][0] + r[i + 1][0]) * f; cy += (r[i][1] + r[i + 1][1]) * f;
    }
    if (Math.abs(a) > bestA && a !== 0) { bestA = Math.abs(a); best = [cx / (3 * a), cy / (3 * a)]; }
  });
  return best || polys[0][0][0];
}
// "E-20 T-18 M-8" -> "20"
function engineNumber(name) { const m = /\bE-?\s*(\d+)/i.exec(name || ''); return m ? m[1] : null; }
/*GEO-END*/

// ============================================================
// CITY DATA (normal request first, JSONP fallback if the browser blocks it)
// ============================================================
let jsonpCount = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = '__city' + (jsonpCount++);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('timed out')); }, 20000);
    function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('blocked')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function cityQuery(layer, params) {
  const qs = new URLSearchParams(Object.assign({ f: 'json', outSR: '4326' }, params)).toString();
  const url = `${CITY}/${layer}/query?${qs}`;
  let data;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    data = await jsonp(url);
  }
  if (data && data.error) throw new Error(data.error.message || 'city server error');
  return data;
}
let cityWarned = false;
function cityFailed(err) {
  console.error(err);
  if (cityWarned) return;
  cityWarned = true;
  showBanner("<strong>Couldn't reach the city's map data.</strong> Box lines and hydrants won't show, but the map and routing still work. Try reloading in a minute.");
}

// ============================================================
// STATE
// ============================================================
let stations = [];            // [{id, name, address, lng, lat, engine}]
let boxes = null;             // GeoJSON FeatureCollection of response districts
let call = null;              // {lng, lat, label}
let callBox = null;           // box feature properties
let routeGeo = null;
let nearHydrants = [];
let areaHydrants = { type: 'FeatureCollection', features: [] };
let callMarker = null, hydMarkers = [];
let gpsOrigin = null;
let styleName = 'dark';

// ============================================================
// MAP
// ============================================================
if (typeof mapboxgl === 'undefined') {
  showBanner("<strong>The map can't load here.</strong> Open this page in Chrome, Safari, Edge or Firefox (not inside a chat preview).");
} else {
  start();
}

function start() {
  mapboxgl.accessToken = MAPBOX_TOKEN;

  // Controls first, so search works even if something below fails
  setupOrigin();
  setupSearch();
  $('grab').onclick = () => $('sheet').classList.toggle('collapsed');
  $('styleBtn').onclick = () => {
    if (!window.map) return;
    styleName = styleName === 'dark' ? 'sat' : 'dark';
    $('styleBtn').textContent = styleName === 'dark' ? 'Satellite' : 'Dark map';
    map.setStyle(STYLES[styleName]);
  };

  try {
    window.map = new mapboxgl.Map({
      container: 'map', style: STYLES.dark,
      center: [DEFAULT_HOUSE.lng, DEFAULT_HOUSE.lat], zoom: 13.5, attributionControl: true
    });
  } catch (e) {
    showBanner("<strong>The map couldn't start on this device.</strong> " + esc(e.message));
    return;
  }
  map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'bottom-right');
  map.addControl(new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), 'bottom-right');

  let tokenWarned = false;
  map.on('error', e => {
    const st = e && e.error && e.error.status;
    if ((st === 401 || st === 403) && !tokenWarned) {
      tokenWarned = true;
      showBanner('<strong>Mapbox rejected the access token.</strong> Check the token at <a href="https://account.mapbox.com" target="_blank">account.mapbox.com</a> and paste it into MAPBOX_TOKEN at the top of the script.');
    }
  });

  map.on('style.load', addOverlays);
  map.on('click', e => {
    const t = e.originalEvent && e.originalEvent.target;
    if (t && t.closest && t.closest('.mapboxgl-marker')) return; // tapped a pin; let its popup open
    if (map.getLayer('area-hydrants') && map.queryRenderedFeatures(e.point, { layers: ['area-hydrants'] }).length) return;
    setCall({ lng: e.lngLat.lng, lat: e.lngLat.lat, label: null });
  });
  map.on('moveend', debounce(loadAreaHydrants, 400));

  loadStations();
  loadBoxes();
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// Re-added every time the base map style loads (style switches wipe custom layers)
function addOverlays() {
  const firstSymbol = (map.getStyle().layers.find(l => l.type === 'symbol') || {}).id;
  const empty = { type: 'FeatureCollection', features: [] };

  map.addSource('boxes', { type: 'geojson', data: boxes || empty });
  map.addSource('box-labels', { type: 'geojson', data: boxLabels() });
  map.addSource('route', { type: 'geojson', data: routeGeo || empty });
  map.addSource('stations', { type: 'geojson', data: stationsGeo() });
  map.addSource('area-hydrants', { type: 'geojson', data: areaHydrants });

  const mine = ['==', ['get', 'engine'], myEngine() || '__none'];
  map.addLayer({ id: 'boxes-mine', type: 'fill', source: 'boxes', filter: mine,
    paint: { 'fill-color': '#f59e0b', 'fill-opacity': 0.10 } }, firstSymbol);
  map.addLayer({ id: 'boxes-call', type: 'fill', source: 'boxes', filter: ['==', ['get', 'box'], callBox ? callBox.box : '__none'],
    paint: { 'fill-color': '#ef4444', 'fill-opacity': 0.22 } }, firstSymbol);
  map.addLayer({ id: 'boxes-line', type: 'line', source: 'boxes',
    paint: { 'line-color': ['case', mine, '#f59e0b', '#ef4444'], 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.6, 15, 2],
             'line-opacity': 0.8, 'line-dasharray': [2, 1.5] } }, firstSymbol);
  map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#0c4a6e', 'line-width': 9 } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#38bdf8', 'line-width': 5 } });
  map.addLayer({ id: 'area-hydrants', type: 'circle', source: 'area-hydrants', minzoom: 15.5,
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 15.5, 3, 18, 7], 'circle-color': '#facc15',
             'circle-stroke-color': '#111', 'circle-stroke-width': 1.5 } });
  map.addLayer({ id: 'box-labels', type: 'symbol', source: 'box-labels', minzoom: 12.5,
    layout: { 'text-field': ['get', 'box'], 'text-size': ['interpolate', ['linear'], ['zoom'], 12.5, 11, 16, 16],
              'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold'], 'text-allow-overlap': false },
    paint: { 'text-color': ['case', mine, '#fbbf24', '#fca5a5'], 'text-halo-color': '#000', 'text-halo-width': 1.6 } });
  map.addLayer({ id: 'stations', type: 'circle', source: 'stations',
    paint: { 'circle-radius': 7, 'circle-color': '#fff', 'circle-stroke-color': '#ef4444', 'circle-stroke-width': 3 } });
  map.addLayer({ id: 'station-labels', type: 'symbol', source: 'stations', minzoom: 11.5,
    layout: { 'text-field': ['get', 'name'], 'text-size': 12, 'text-offset': [0, 1.3], 'text-anchor': 'top',
              'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold'] },
    paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 1.6 } });

  map.on('click', 'area-hydrants', e => {
    const p = e.features[0].properties;
    new mapboxgl.Popup({ offset: 8 }).setLngLat(e.lngLat).setHTML(hydrantHTML(p)).addTo(map);
  });
  map.on('mouseenter', 'area-hydrants', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'area-hydrants', () => map.getCanvas().style.cursor = '');
  loadAreaHydrants();
}

function setData(src, data) { const s = map.getSource(src); if (s) s.setData(data); }
function refreshBoxFilters() {
  const mine = ['==', ['get', 'engine'], myEngine() || '__none'];
  if (map.getLayer('boxes-mine')) map.setFilter('boxes-mine', mine);
  if (map.getLayer('boxes-call')) map.setFilter('boxes-call', ['==', ['get', 'box'], callBox ? callBox.box : '__none']);
  if (map.getLayer('boxes-line')) map.setPaintProperty('boxes-line', 'line-color', ['case', mine, '#f59e0b', '#ef4444']);
  if (map.getLayer('box-labels')) map.setPaintProperty('box-labels', 'text-color', ['case', mine, '#fbbf24', '#fca5a5']);
}

// ============================================================
// LOAD CITY LAYERS
// ============================================================
async function loadStations() {
  try {
    const d = await cityQuery(LAYER.stations, { where: '1=1', outFields: 'NAME,ADDRESS', returnGeometry: 'true' });
    stations = (d.features || []).filter(f => f.geometry).map(f => {
      const name = clean(f.attributes.NAME).replace(/\s+/g, ' ');
      return { name, address: clean(f.attributes.ADDRESS), lng: f.geometry.x, lat: f.geometry.y, engine: engineNumber(name) };
    }).filter(s => s.engine).sort((a, b) => a.engine - b.engine);
    stations.forEach(s => s.id = 'E-' + s.engine);
  } catch (e) {
    cityFailed(e);
  }
  if (!stations.length) stations = [Object.assign({ engine: '20' }, DEFAULT_HOUSE)];
  fillOrigin();
  setData('stations', stationsGeo());
}

async function loadBoxes() {
  try {
    let feats = [], offset = 0, more = true;
    while (more && offset < 5000) {
      const d = await cityQuery(LAYER.boxes, {
        where: '1=1', outFields: `${AREA_FIELD},MapBook`, returnGeometry: 'true',
        maxAllowableOffset: '0.00002', geometryPrecision: '6', resultOffset: String(offset), orderByFields: 'OBJECTID_1'
      });
      const got = d.features || [];
      feats = feats.concat(got);
      offset += got.length;
      more = d.exceededTransferLimit && got.length > 0;
    }
    boxes = { type: 'FeatureCollection', features: feats.filter(f => f.geometry && f.geometry.rings && f.geometry.rings.length).map((f, i) => {
      const box = clean(f.attributes[AREA_FIELD]);
      return { type: 'Feature', id: i, geometry: esriToGeo(f.geometry.rings),
        properties: { box, engine: (box.split('-')[0] || '').replace(/\D/g, ''), house: clean(f.attributes.MapBook) } };
    }) };
    setData('boxes', boxes);
    setData('box-labels', boxLabels());
    if (call && !callBox) { callBox = findBox(call); renderSheet(); refreshBoxFilters(); }
  } catch (e) {
    cityFailed(e);
  }
}

async function loadAreaHydrants() {
  if (!window.map || map.getZoom() < 15.5) return;
  const b = map.getBounds();
  try {
    const d = await cityQuery(LAYER.hydrants, {
      geometry: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(','), geometryType: 'esriGeometryEnvelope',
      inSR: '4326', spatialRel: 'esriSpatialRelIntersects', outFields: HYDRANT_FIELDS, returnGeometry: 'true'
    });
    areaHydrants = { type: 'FeatureCollection', features: (d.features || []).filter(f => f.geometry).map(f => ({
      type: 'Feature', geometry: { type: 'Point', coordinates: [f.geometry.x, f.geometry.y] }, properties: f.attributes })) };
    setData('area-hydrants', areaHydrants);
  } catch (e) { cityFailed(e); }
}

function boxLabels() {
  if (!boxes) return { type: 'FeatureCollection', features: [] };
  return { type: 'FeatureCollection', features: boxes.features.map(f => ({
    type: 'Feature', properties: f.properties, geometry: { type: 'Point', coordinates: labelPoint(f.geometry) } })) };
}
function stationsGeo() {
  return { type: 'FeatureCollection', features: stations.map(s => ({
    type: 'Feature', properties: { name: s.name }, geometry: { type: 'Point', coordinates: [s.lng, s.lat] } })) };
}
function findBox(pt) {
  if (!boxes) return null;
  const f = boxes.features.find(f => pointInGeo([pt.lng, pt.lat], f.geometry));
  return f ? f.properties : null;
}

// ============================================================
// RESPONDING-FROM PICKER
// ============================================================
function setupOrigin() {
  $('origin').onchange = () => {
    store('origin', $('origin').value);
    refreshBoxFilters();
    if ($('origin').value === 'gps') getGps().then(() => call && runRoute());
    else if (call) runRoute();
  };
}
function fillOrigin() {
  const saved = store('origin') || DEFAULT_HOUSE.id;
  $('origin').innerHTML = stations.map(s =>
    `<option value="${esc(s.id)}">From ${esc(s.name)} — ${esc(s.address.replace(/\s\d{5}$/, ''))}</option>`).join('') +
    '<option value="gps">From my current location (GPS)</option>';
  $('origin').value = [...$('origin').options].some(o => o.value === saved) ? saved : (stations[0] || {}).id;
  refreshBoxFilters();
  if ($('origin').value === 'gps') getGps();
}
function currentOrigin() {
  const v = $('origin').value;
  if (v === 'gps') return gpsOrigin;
  return stations.find(s => s.id === v) || DEFAULT_HOUSE;
}
function myEngine() {
  const v = $('origin').value;
  if (!v || v === 'gps') return null;
  return v.replace('E-', '');
}
function getGps() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { showBanner('This device can\'t share its location.'); return resolve(); }
    navigator.geolocation.getCurrentPosition(
      p => { gpsOrigin = { name: 'My location', lng: p.coords.longitude, lat: p.coords.latitude }; resolve(); },
      () => { showBanner('Location permission was denied, so routing will start from your firehouse.'); resolve(); },
      { enableHighAccuracy: true, timeout: 10000 });
  });
}

// ============================================================
// ADDRESS SEARCH (Mapbox geocoding, limited to Baltimore City)
// ============================================================
let lastResults = [];
function fmtResult(main, rest, lng, lat) { return { main, rest, lng, lat }; }

// Try Mapbox's v5 geocoder, then its newer v6 one. Returns [{main, rest, lng, lat}] or throws with a reason.
async function geocode(text) {
  const o = currentOrigin() || DEFAULT_HOUSE;
  const common = `access_token=${MAPBOX_TOKEN}&limit=6&country=us&bbox=${CITY_BBOX.join(',')}&proximity=${o.lng},${o.lat}`;
  let reason = '';
  try {
    const r = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(text)}.json?${common}&autocomplete=true&types=address,poi,postcode`);
    const d = await r.json().catch(() => ({}));
    if (r.status === 401 || r.status === 403) throw Object.assign(new Error('token'), { token: true });
    if (r.ok && Array.isArray(d.features)) {
      return d.features.map(f => {
        const main = f.address ? `${f.address} ${f.text}` : f.text;
        return fmtResult(main, f.place_name.replace(main + ', ', ''), f.center[0], f.center[1]);
      });
    }
    reason = d.message || ('HTTP ' + r.status);
  } catch (e) { if (e.token) throw e; reason = e.message; }
  // Fallback: Mapbox Geocoding v6
  const r = await fetch(`https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(text)}&${common}&autocomplete=true`);
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error('token'), { token: true });
  if (!r.ok || !Array.isArray(d.features)) throw new Error(d.message || reason || ('HTTP ' + r.status));
  return d.features.map(f => {
    const p = f.properties || {};
    const main = p.name || p.full_address || 'Result';
    return fmtResult(main, p.place_formatted || p.full_address || '', f.geometry.coordinates[0], f.geometry.coordinates[1]);
  });
}

function setupSearch() {
  const q = $('q'), box = $('suggest');
  const say = html => { box.innerHTML = `<div style="color:var(--muted);cursor:default">${html}</div>`; box.style.display = 'block'; };
  let seq = 0, picked = '';
  async function run(autoPick) {
    const text = q.value.trim();
    if (text.length < 3) { box.style.display = 'none'; return; }
    if (!autoPick && text === picked) return; // already chose this one
    const mine = ++seq;
    say('Searching…');
    try {
      const results = await geocode(text);
      if (mine !== seq) return;
      lastResults = results;
      if (!results.length) { say('No matches in Baltimore City. Try adding the street type, like "Ave" or "St".'); return; }
      if (autoPick) { pick(0); return; }
      box.innerHTML = results.map((f, i) => `<div data-i="${i}">${esc(f.main)}<small>${esc(f.rest)}</small></div>`).join('');
      box.style.display = 'block';
    } catch (e) {
      if (mine !== seq) return;
      lastResults = [];
      if (e.token) say('<b style="color:#fca5a5">Mapbox rejected the access token.</b> If you deleted or changed it, paste the new one into MAPBOX_TOKEN at the top of the script.');
      else if (location.protocol === 'file:' && /fail|network|load/i.test(e.message)) say('<b style="color:#fca5a5">Search couldn\'t reach Mapbox.</b> Check your internet connection, or open the page from a web link (like Netlify) instead of a saved file.');
      else say('<b style="color:#fca5a5">Search failed:</b> ' + esc(e.message));
    }
  }
  const typed = debounce(() => run(false), 300);
  q.addEventListener('input', typed);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lastResults.length ? pick(0) : run(true); } });
  $('go').onclick = () => (lastResults.length && box.style.display === 'block' && box.querySelector('[data-i]')) ? pick(0) : run(true);
  box.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) pick(+d.dataset.i); });
  $('clear').onclick = () => { q.value = ''; lastResults = []; box.style.display = 'none'; clearCall(); };
  function pick(i) {
    const f = lastResults[i]; if (!f) return;
    seq++; box.style.display = 'none'; q.blur();
    q.value = f.main; picked = f.main.trim();
    lastResults = [];
    setCall({ lng: f.lng, lat: f.lat, label: f.main });
  }
}

async function reverseLabel(pt) {
  try {
    const r = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${pt.lng},${pt.lat}.json?access_token=${MAPBOX_TOKEN}&types=address&limit=1`);
    const d = await r.json(); const f = (d.features || [])[0];
    return f ? (f.address ? `${f.address} ${f.text}` : f.text) : null;
  } catch (e) { return null; }
}

// ============================================================
// A CALL IS SET: box, route, hydrants
// ============================================================
let callSeq = 0;
async function setCall(pt) {
  const seq = ++callSeq;
  call = pt; callBox = findBox(pt); routeGeo = null; nearHydrants = null; window._route = null;
  if (callMarker) callMarker.remove();
  const el = document.createElement('div'); el.className = 'call-pin';
  callMarker = new mapboxgl.Marker({ element: el, anchor: 'bottom' }).setLngLat([pt.lng, pt.lat]).addTo(map);
  hydMarkers.forEach(m => m.remove()); hydMarkers = [];
  setData('route', { type: 'FeatureCollection', features: [] });
  refreshBoxFilters();
  $('sheet').classList.remove('collapsed');
  renderSheet();

  if (!pt.label) reverseLabel(pt).then(l => { if (seq === callSeq && l) { call.label = l; renderSheet(); } });
  runRoute();
  loadNearHydrants(seq);
}

function clearCall() {
  callSeq++; call = null; callBox = null; routeGeo = null; nearHydrants = []; window._route = null;
  if (callMarker) callMarker.remove(); callMarker = null;
  hydMarkers.forEach(m => m.remove()); hydMarkers = [];
  setData('route', { type: 'FeatureCollection', features: [] });
  refreshBoxFilters();
  $('sheetBody').innerHTML = '<div class="hint">Search a call address, or tap anywhere on the map to drop a call pin.</div>';
}

async function runRoute() {
  const seq = callSeq, o = currentOrigin();
  if (!call || !o) { renderSheet(); return; }
  window._route = 'loading'; renderSheet();
  try {
    const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${o.lng},${o.lat};${call.lng},${call.lat}` +
      `?geometries=geojson&overview=full&steps=true&access_token=${MAPBOX_TOKEN}`;
    const r = await fetch(url); const d = await r.json();
    if (seq !== callSeq) return;
    if (!r.ok || !d.routes || !d.routes.length) throw new Error(d.message || 'No route found');
    const rt = d.routes[0];
    window._route = rt;
    routeGeo = { type: 'Feature', properties: {}, geometry: rt.geometry };
    setData('route', routeGeo);
    fitAll();
  } catch (e) {
    if (seq !== callSeq) return;
    window._route = { error: e.message };
  }
  renderSheet();
}

async function loadNearHydrants(seq) {
  const base = { geometry: `${call.lng},${call.lat}`, geometryType: 'esriGeometryPoint', inSR: '4326',
    spatialRel: 'esriSpatialRelIntersects', units: 'esriSRUnit_Foot', outFields: HYDRANT_FIELDS, returnGeometry: 'true' };
  try {
    let d = await cityQuery(LAYER.hydrants, Object.assign({ distance: '700' }, base));
    if (!(d.features || []).length) d = await cityQuery(LAYER.hydrants, Object.assign({ distance: '2000' }, base));
    if (seq !== callSeq) return;
    nearHydrants = (d.features || []).filter(f => f.geometry).map(f => ({
      p: f.attributes, lng: f.geometry.x, lat: f.geometry.y,
      ft: feetBetween([call.lng, call.lat], [f.geometry.x, f.geometry.y]) }))
      .sort((a, b) => a.ft - b.ft).slice(0, 5);
    nearHydrants.forEach((h, i) => {
      const el = document.createElement('div'); el.className = 'hyd-pin'; el.textContent = i + 1;
      hydMarkers.push(new mapboxgl.Marker({ element: el }).setLngLat([h.lng, h.lat])
        .setPopup(new mapboxgl.Popup({ offset: 14 }).setHTML(hydrantHTML(h.p))).addTo(map));
    });
  } catch (e) {
    if (seq !== callSeq) return;
    nearHydrants = []; cityFailed(e);
  }
  renderSheet(); fitAll();
}

function fitAll() {
  if (!call) return;
  const b = new mapboxgl.LngLatBounds([call.lng, call.lat], [call.lng, call.lat]);
  if (routeGeo) routeGeo.geometry.coordinates.forEach(c => b.extend(c));
  (nearHydrants || []).forEach(h => b.extend([h.lng, h.lat]));
  const top = $('topbar').offsetHeight + 20;
  const wide = window.innerWidth >= 820;
  const bottom = wide ? 40 : Math.min($('sheet').offsetHeight, window.innerHeight * 0.5) + 20;
  const left = wide ? 420 : 40;
  map.fitBounds(b, { padding: { top, bottom, left, right: 40 }, maxZoom: 17.5, duration: 700 });
}

// ============================================================
// BOTTOM SHEET
// ============================================================
function hydrantText(p) {
  const loc = clean(p.CAD_ADDR) || [clean(p.STREET_NUM), clean(p.STREET_NAM)].filter(Boolean).join(' ') || clean(p.LOCATION_1) || 'Hydrant';
  const corner = [clean(p.CORNER_POS), clean(p.CROSS_STRE)].filter(Boolean).join(' corner, cross st ');
  const extra = [corner, clean(p.LOCATION_D)].filter(Boolean).join(' · ');
  const main = Number(p.SRC_MAIN_S) > 0 ? `${p.SRC_MAIN_S}" main` : '';
  const flags = [clean(p.FEAT_STATU), clean(p.CONDITION)].filter(Boolean);
  return { loc, extra, main, flags, id: clean(p.HYDRANT_ID) };
}
function hydrantHTML(p) {
  const t = hydrantText(p);
  return `<b>${esc(t.loc)}</b>${t.extra ? `<br>${esc(t.extra)}` : ''}` +
    `${t.main ? `<br>${esc(t.main)}` : ''}${t.id ? `<br><span style="color:#9aa3b2">ID ${esc(t.id)}</span>` : ''}`;
}
function fmtMin(sec) { const m = Math.round(sec / 60); return m < 1 ? '<1 min' : m + ' min'; }
function fmtMi(m) { const mi = m / 1609.34; return (mi < 0.1 ? Math.round(m * 3.281) + ' ft' : mi.toFixed(1) + ' mi'); }

function renderSheet() {
  if (!call) return;
  const o = currentOrigin();
  const rt = window._route;
  const label = call.label || `${call.lat.toFixed(5)}, ${call.lng.toFixed(5)}`;
  const boxTxt = callBox ? callBox.box : (boxes ? 'Outside city boxes' : '<span class="loading">loading…</span>');
  const house = callBox ? callBox.house : (boxes ? '—' : '<span class="loading">loading…</span>');
  const mineTag = callBox && myEngine() && callBox.engine === myEngine() ? ' <span class="tag" style="background:#78350f;color:#fde68a">your box</span>' : '';

  let routeTxt = '<span class="loading">routing…</span>';
  if (!o) routeTxt = 'Waiting for GPS…';
  else if (rt && rt.error) routeTxt = 'No route: ' + esc(rt.error);
  else if (rt && rt.duration != null) routeTxt = `${fmtMin(rt.duration)} · ${fmtMi(rt.distance)}`;

  const dest = `${call.lat},${call.lng}`;
  let hyd = '<div class="loading">Finding hydrants…</div>';
  if (Array.isArray(nearHydrants)) {
    hyd = nearHydrants.length ? nearHydrants.map((h, i) => {
      const t = hydrantText(h.p);
      return `<div class="hyd" data-h="${i}"><div class="num">${i + 1}</div><div>
        <div class="main">${esc(t.loc)} <span class="tag">${Math.round(h.ft)} ft</span>${t.main ? `<span class="tag">${esc(t.main)}</span>` : ''}${t.flags.map(f => `<span class="tag">${esc(f)}</span>`).join('')}</div>
        ${t.extra ? `<div class="sub">${esc(t.extra)}</div>` : ''}</div></div>`;
    }).join('') : '<div class="hint">No hydrants found within 2,000 ft.</div>';
  }

  const steps = rt && rt.legs ? rt.legs[0].steps.map(s =>
    `<li>${esc(s.maneuver.instruction)} <span style="color:var(--muted)">${s.distance > 0 ? fmtMi(s.distance) : ''}</span></li>`).join('') : '';

  $('sheetBody').innerHTML = `
    <div class="addr">${esc(label)}</div>
    <div class="stats">
      <div class="stat box"><span>Box</span><b>${boxTxt}</b>${mineTag}</div>
      <div class="stat"><span>First due house</span><b>${house}</b></div>
      <div class="stat wide"><span>Drive from ${esc(o ? o.name : '…')} (civilian estimate)</span><b>${routeTxt}</b></div>
    </div>
    <div class="btns">
      <a href="https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving" target="_blank" rel="noopener">Google Maps</a>
      <a href="https://maps.apple.com/?daddr=${dest}&dirflg=d" target="_blank" rel="noopener">Apple Maps</a>
    </div>
    <h3>Nearest hydrants</h3>
    ${hyd}
    ${steps ? `<details><summary>Turn-by-turn directions</summary><ol class="steps">${steps}</ol></details>` : ''}
    <p class="fine">Reference and study tool. Drive times are normal-traffic estimates, and box lines and hydrants come from Baltimore City's public 911-CAD map data. Always go by dispatch and your unit's terminal.</p>`;

  $('sheetBody').querySelectorAll('[data-h]').forEach(el => el.onclick = () => {
    const h = nearHydrants[+el.dataset.h];
    map.flyTo({ center: [h.lng, h.lat], zoom: 18 });
    hydMarkers[+el.dataset.h].togglePopup();
  });
}
</script>
